name: Refresh dashboard

on:
  schedule:
    # GitHub's scheduler is best-effort: runs are frequently delayed and slots
    # are silently dropped under load. Firing every 20 min means a couple of
    # skipped slots still leaves the data roughly hourly-fresh. Runs are ~15s
    # and commit nothing when the data is unchanged, so this is close to free.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:           # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull Shopify / Meta / Klaviyo
        env:
          SHOPIFY_STORE:         ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          META_TOKEN:            ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT:       ${{ secrets.META_AD_ACCOUNT }}
          KLAVIYO_KEY:           ${{ secrets.KLAVIYO_KEY }}
        run: python3 fetch_all.py

      - name: Build data.json
        run: python3 build_data.py

      - name: Commit if changed
        run: |
          git config user.name  "lumara-ops-bot"
          git config user.email "actions@github.com"
          git add raw.json data.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
